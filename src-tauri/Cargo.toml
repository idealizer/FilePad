[package]
name = "filepad"
version = "0.1.0"
description = "A two-panel file commander"
authors = ["Idealizer"]
edition = "2024"

[lib]
name = "filepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
portable-pty = "0.9"
open = { version = "5", features = ["shellexecute-on-windows"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
deckcraft-model = "0.6.1"
deckcraft-pptx = "0.6.1"
deckcraft-render = "0.6.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"
russh = "0.65.1"
russh-sftp = "3.0.1"
keyring = "4.2.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "process", "sync", "fs"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
